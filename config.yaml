# ==========================================================
# arXiv categories
# ==========================================================
# Core track avoids cs.CV because "social event detection" in CV often means
# recognizing weddings / sports / parties in images rather than detecting
# events from social-media streams.
categories:
  - "cs.CL"
  - "cs.SI"
  - "cs.AI"
  - "cs.LG"

# Related track may be broader. cs.CV is allowed here because the LLM
# relevance filter below will remove visual-event / event-camera noise.
related_categories:
  - "cs.CL"
  - "cs.SI"
  - "cs.AI"
  - "cs.LG"
  - "cs.IR"
  - "cs.CV"

# ==========================================================
# Track 1: Core — Social Event Detection
# ==========================================================
# Keep only phrases that strongly indicate the actual SED task.
keywords:
  - "social event detection"
  - "social media event detection"
  - "event detection on social media"
  - "event detection in social media"
  - "event detection from social media"
  - "social event discovery"
  - "social media event discovery"
  - "social event clustering"
  - "social media event clustering"
  - "microblog event detection"
  - "social stream event detection"
  - "incremental social event detection"
  - "unsupervised social event detection"
  - "open-world social event detection"
  - "open-set social event detection"
  - "social event evolution"
  - "social media event evolution"

# ==========================================================
# Track 2: Related Research
# ==========================================================
# A) Direct phrases: broad enough to discover adjacent work, but still tied
#    to social media / social streams.
related_keywords:
  - "social media event extraction"
  - "social media event discovery"
  - "social media event evolution"
  - "multimodal social media event detection"
  - "multimodal social media event extraction"
  - "emerging event detection in social media"
  - "online event detection in social media"
  - "streaming event detection in social media"
  - "topic detection and tracking in social media"
  - "topic discovery in social media"
  - "emerging topic detection in social media"

# B) Broad methods are NEVER searched alone.
related_method_keywords:
  - "large language model"
  - "LLM"
  - "retrieval augmented generation"
  - "RAG"
  - "temporal graph neural network"
  - "dynamic graph neural network"
  - "heterogeneous graph neural network"
  - "graph neural network"
  - "graph clustering"
  - "online clustering"
  - "streaming clustering"
  - "contrastive learning"
  - "multimodal large language model"
  - "vision language model"
  - "structural entropy"
  - "hyperbolic representation"

# C) A broad method must co-occur with BOTH one social-media anchor
#    and one event/topic anchor.
related_social_context_keywords:
  - "social media"
  - "social network"
  - "online social network"
  - "microblog"
  - "twitter"
  - "tweet"
  - "weibo"
  - "reddit"
  - "user-generated content"

related_event_context_keywords:
  - "event detection"
  - "event discovery"
  - "event extraction"
  - "event clustering"
  - "event evolution"
  - "topic detection"
  - "topic discovery"
  - "emerging event"
  - "emerging topic"

# Query-level exclusions for very stable, clearly irrelevant meanings of
# "event detection". The LLM filter below performs the finer semantic check.
exclude_keywords:
  - "event camera"
  - "event-based vision"
  - "neuromorphic vision"
  - "sound event detection"
  - "acoustic event detection"
  - "audio event detection"

# categories group AND keyword group
logic: "AND"

# Final email quota. The program fetches more candidates before semantic
# filtering, then keeps at most these numbers.
max_results: 10
core_max_results: 7
related_max_results: 3

sort_by: "submittedDate"
sort_order: "descending"

# zh / en / both
lang: "both"

# ==========================================================
# LLM semantic relevance filter
# ==========================================================
relevance_filter:
  enabled: true

  # Fetch 3x the final quota before semantic filtering, so removing noise does
  # not leave the email almost empty.
  candidate_multiplier: 3

  # Final acceptance thresholds after LLM classification.
  core_threshold: 0.78
  related_threshold: 0.70

  # If the relevance API is temporarily unavailable, keep candidates instead
  # of silently losing new papers. Set false if you prefer strict fail-closed.
  fail_open: true

  # Deterministic pre-filter. These are checked against title + abstract before
  # calling the LLM, which reduces token usage and obvious noise.
  hard_noise_keywords:
    - "event camera"
    - "event-based vision"
    - "neuromorphic vision"
    - "sound event detection"
    - "acoustic event detection"
    - "audio event detection"
    - "temporal action localization"
    - "human action recognition"
    - "video anomaly detection"
    - "clinical event detection"
    - "medical event detection"
    - "financial event detection"
    - "sensor event detection"

  system_prompt: |
    You are a strict academic relevance classifier for Social Event Detection (SED).

    The target research problem is: detecting, discovering, clustering, tracking,
    evolving, or extracting real-world events from social-media / social-network /
    microblog / user-generated streams, including online, incremental, unsupervised,
    open-world, multimodal, graph-based, LLM/RAG-based, and event-evolution settings.

    Label a paper as:
    - core: its main task is directly Social Event Detection or Social Media Event Detection.
    - related: it is not directly SED, but its main task/method is clearly transferable to
      SED, AND it is still about social-media/social-network streams plus events/topics.
    - noise: it uses the word "event" in a different meaning/domain or is only weakly related.

    Typical noise includes event cameras, event-based vision, image/video activity recognition,
    sound/acoustic events, medical/clinical events, finance events, cybersecurity events,
    generic sensor events, and generic event extraction with no social-media/event-stream context.

    Be conservative. Do not keep a paper merely because it contains one matching keyword.

# ==========================================================
# Summary
# ==========================================================
summary:
  mode: "llm"
  scope: "both"

# ==========================================================
# Email (QQ Mail)
# ==========================================================
email:
  enabled: true
  subject: "[arXiv] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 10
  attach_md: true
  attach_pdf: false

# ==========================================================
# LLM (OpenAI-compatible API)
# ==========================================================
llm:
  provider: "openai-compatible"
  base_url: "https://api.siliconflow.cn"
  model: "deepseek-flash"
  api_key_env: "OPENAI_COMPAT_API_KEY"

  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English that covers: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
    Preserve any provided links, but do NOT repeat them in the paragraph.

  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确；避免营销式表述。
    如有链接请保留，但不要在总结里重复链接。

# ==========================================================
# Chinese translation
# ==========================================================
translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

# ==========================================================
# Static site
# ==========================================================
site:
  enabled: true
  dir: "docs"
  title: "arXiv 论文速递"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

# ==========================================================
# Freshness + cross-day dedup
# ==========================================================
freshness:
  # Seven-day retrieval window tolerates arXiv/API timing differences; seen.json
  # still guarantees that successfully emailed papers are not resent.
  since_days: 7
  unique_only: true
  state_path: ".state/seen.json"
  fallback_when_empty: false
  mark_seen_on_site: false

# ==========================================================
# Link scraping
# ==========================================================
scrape:
  html: true
  pdf_if_missing: true
  pdf_first_page: false
  timeout: 10
