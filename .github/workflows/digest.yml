name: arxiv-digest

on:
  # Manual run: choose whether this run should send email.
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email for manual run?"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]

  # Daily at 19:00 UTC = Beijing time 03:00 next day.
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: arxiv-digest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies for Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libcairo2-dev \
            python3-cairo \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libfreetype6-dev \
            pkg-config

      - name: Prep build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "meson>=1.4" "ninja>=1.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute Pages URL
        id: site
        run: |
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          echo "url=https://${OWNER}.github.io/${NAME}/" >> "$GITHUB_OUTPUT"

      - name: Show email env (masked)
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python - <<'PY'
          import os
          import re

          def mask(value):
              if not value:
                  return ""
              value = str(value)
              if "@" in value:
                  return re.sub(r'(^.).*(@.*$)', r'\1***\2', value)
              return value[:1] + "***"

          tos = [
              x.strip()
              for x in re.split(r'[;,]', os.getenv('EMAIL_TO', ''))
              if x.strip()
          ]

          print("EMAIL_TO     :", [mask(x) for x in tos])
          print("EMAIL_SENDER :", mask(os.getenv('EMAIL_SENDER', '')))
          print("SMTP_USER    :", mask(os.getenv('SMTP_USER', '')))
          print("HAS_SMTP_PASS:", bool(os.getenv('SMTP_PASS')))
          PY

      - name: Show LLM env (masked)
        env:
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY || vars.OPENAI_COMPAT_API_KEY }}
          DS_API_KEY: ${{ secrets.DS_API_KEY || vars.DS_API_KEY }}
        run: |
          python - <<'PY'
          import os

          def flag(key):
              print(f"{key}: {'SET' if os.getenv(key) else 'MISSING'}")

          flag("OPENAI_COMPAT_API_KEY")
          flag("DS_API_KEY")
          PY

      - name: Who am I (for diagnostics)
        run: |
          echo "run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }} event=${{ github.event_name }} input.send_email=${{ inputs.send_email }}"

      - name: Run tracker and generate site
        env:
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY || vars.OPENAI_COMPAT_API_KEY }}
          DS_API_KEY: ${{ secrets.DS_API_KEY || vars.DS_API_KEY }}

          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          ARXIV_TIMEOUT: "60"
          ARXIV_MAX_ATTEMPTS: "8"
          ARXIV_PAUSE: "5"
          ARXIV_MAX_SLEEP: "120"
        run: |
          set -e

          EVENT="${{ github.event_name }}"
          ATTEMPT="${{ github.run_attempt }}"
          SEND="${{ inputs.send_email || 'false' }}"
          EXTRA=""

          # Email rules:
          # 1) Scheduled first attempt -> send email.
          # 2) Manual run with send_email=true -> send email.
          # 3) Retry/other manual runs -> --no-email.
          if { [ "$EVENT" = "schedule" ] && [ "$ATTEMPT" = "1" ]; } || \
             { [ "$EVENT" = "workflow_dispatch" ] && [ "$SEND" = "true" ]; }; then
            EXTRA=""
          else
            EXTRA="--no-email"
          fi

          echo "event=$EVENT attempt=$ATTEMPT manual.send_email=$SEND EXTRA=$EXTRA"

          python -m arxiv_tracker.cli run \
            --config config.yaml \
            --site-dir docs \
            --site-url "${{ steps.site.outputs.url }}" \
            $EXTRA \
            --verbose

      - name: Show generated changes
        run: |
          git status --short

      # No file_pattern is used intentionally.
      # The action commits all changed generated files, including docs/, outputs/
      # and .state/seen.json. This avoids pathspec failures when one pattern has
      # no matching change on a particular day.
      - name: Commit generated site, outputs and dedup state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update digest, site & dedup state"

# GitHub Pages:
# Settings -> Pages -> Deploy from a branch -> main / docs
